name: Android MVP CI

concurrency:
  group: android-mvp-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform scaffolding
        run: flutter create --platforms=android,ios --org com.wasel.app .
      - name: Add foreground location permission for Android
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
      - name: Configure iOS foreground location disclosure
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/Runner/Info.plist")
          data = plistlib.loads(path.read_bytes())
          data["NSLocationWhenInUseUsageDescription"] = "يستخدم واصل موقعك فقط عند تفعيل ميزة الأشخاص القريبين."
          path.write_bytes(plistlib.dumps(data))
          PY
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found at $SDKMANAGER"
            exit 1
          fi
          # sdkmanager closes stdin after accepting licenses; avoid treating yes SIGPIPE as a failure.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Installing Android NDK 28.2.13676358 (attempt $attempt/3)"
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" &&
              test -f "$SDK_ROOT/ndk/28.2.13676358/source.properties"; then
              echo "Android NDK 28.2.13676358 is installed."
              exit 0
            fi
            rm -rf "$SDK_ROOT/ndk/28.2.13676358"
            sleep $((attempt * 10))
          done
          echo "Could not install Android NDK 28.2.13676358 after 3 attempts."
          exit 1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: wasel-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
