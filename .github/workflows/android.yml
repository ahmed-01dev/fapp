name: Android MVP CI

concurrency:
  group: android-mvp-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform scaffolding
        run: flutter create --platforms=android,ios --org com.wasel.app .
      - name: Add foreground location permission for Android
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
      - name: Configure iOS foreground location disclosure
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/Runner/Info.plist")
          data = plistlib.loads(path.read_bytes())
          data["NSLocationWhenInUseUsageDescription"] = "يستخدم واصل موقعك فقط عند تفعيل ميزة الأشخاص القريبين."
          path.write_bytes(plistlib.dumps(data))
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: wasel-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
